<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Readact mark: an "R" whose bowl is a highlighter redaction bar -->
  <rect width="64" height="64" rx="16" fill="#0B0B0F"/>
  <!-- stem -->
  <rect x="15" y="13" width="9" height="38" rx="2" fill="#FAFAF7"/>
  <!-- bowl outline -->
  <path d="M24 13h12.5a11.5 11.5 0 0 1 0 23H24v-7h12.5a4.5 4.5 0 0 0 0-9H24z" fill="#FAFAF7"/>
  <!-- leg -->
  <path d="M31 36h9.2l9.8 15h-9.4z" fill="#FAFAF7"/>
  <!-- the redaction bar sliding through the bowl -->
  <rect x="21" y="20" width="26" height="9" rx="1.5" fill="#FFE14D"/>
</svg>
